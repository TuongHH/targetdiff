name: targetdiff
channels:
  - pyg
  - pytorch
  - nvidia
  - conda-forge
dependencies:
  - python=3.8
  - pytorch=1.13.1=*cuda11.6*
  - pytorch-mutex=*=cuda
  - pytorch-cuda=11.6
  - mkl<2024.1          # newer MKL breaks pytorch<2.3 (undefined symbol iJIT_NotifyEvent)
  - pyg=2.2.0=*cu116
  - pytorch-scatter=*=*cu116
  - pytorch-cluster=*=*cu116
  - pytorch-sparse=*=*cu116
  - numpy<1.25
  - scipy
  - scikit-learn
  - pandas
  - matplotlib-base
  - rdkit=2022.03
  - openbabel=3.1.1
  - tensorboard
  - pyyaml
  - easydict
  - python-lmdb
  - tqdm
  - pip
  - pip:
      - git+https://github.com/Valdes-Tresanco-MS/AutoDockTools_py3.git@aee55d50d5bdcfdbcd80220499df8cde2a8f4b2a
      - docutils==0.17.1
      - meeko==0.1.dev3
      - mmcif-pdbx==2.0.1
      - pdb2pqr==3.6.1
      - propka==3.5.0
      - vina==1.2.2
